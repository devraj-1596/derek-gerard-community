<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join the Community | Derek Gerard Fan Site</title><meta name="description" content="Send your video idea to the Derek Gerard fan community.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"></head><body data-page="community">
<div id="site-header"></div><main>
<section class="pagehead"><div class="wrap"><h1>Join the community</h1><p>Got an idea for a video? Want to be part of what's next?</p></div></section>
<section class="s"><div class="wrap"><form id="joinform" novalidate>
<div><label for="name">Name</label><input id="name" name="name" autocomplete="name" required maxlength="80"><div class="err" id="e-name"></div></div>
<div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="120"><div class="err" id="e-email"></div></div>
<div><label for="type">Favourite type of Derek video</label><select id="type" name="type" required><option value="">Choose one…</option><option>Challenges</option><option>Food challenges</option><option>That Library Show interviews</option><option>Other</option></select><div class="err" id="e-type"></div></div>
<div><label for="message">Message / video idea</label><textarea id="message" name="message" required maxlength="2000"></textarea><div class="err" id="e-message"></div></div>
<div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<div id="status" role="status" aria-live="polite" tabindex="-1"></div>
<div><button class="btn" id="send" type="submit">Submit</button></div></form></div></section>
</main><div id="site-footer"></div><script src="assets/js/site.js"></script></body></html>
